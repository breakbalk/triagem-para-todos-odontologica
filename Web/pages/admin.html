<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel — Equipe COE</title>
    <link rel="stylesheet" href="/css/style.min.css">
</head>
<body class="bg-app" data-page="admin">

    <header class="app-header">
        <div class="app-header-inner">
            <h1>Triagens recebidas</h1>
            <nav class="app-nav">
                <a href="/pages/home.html" class="btn-nav btn-ghost" aria-label="Voltar para a página inicial">← Voltar</a>
                <button type="button" class="btn-nav btn-logout" data-action="logout" aria-label="Sair da conta e encerrar sessão">Sair</button>
            </nav>
        </div>
    </header>

    <main class="app-main">
        <p id="msg" class="form-msg" hidden></p>
        <div class="admin-toolbar">
            <div class="search-box">
                <input type="text" id="admin-search" placeholder="Filtrar por paciente ou serviço..." class="form-control">
            </div>
        </div>
        
        <!-- Altura mínima aplicada para manter o card consistente -->
        <div class="table-wrap" style="min-height: 520px;">
            <!-- Largura fixa aplicada para manter as colunas alinhadas em todas as páginas -->
            <table id="admin-table" class="admin-table" style="table-layout: fixed; width: 100%;">
                <thead>
                    <tr>
                        <th>Protocolo</th>
                        <th>ID usuário</th>
                        <th>Paciente</th>
                        <th>Telefone</th>
                        <th>Serviço</th>
                        <th>Período</th>
                        <th>Status</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Controles de Paginação padronizados e com borda escura -->
        <div id="paginacao-container" style="margin: 20px 0; text-align: center; display: flex; justify-content: center; gap: 15px; align-items: center;">
            <button id="btn-anterior" class="btn-nav btn-ghost" onclick="mudarPagina(-1)" style="cursor: pointer; border: 1px solid #333; border-radius: 20px; padding: 6px 16px; background-color: #ffffff; color: #333;">&laquo; Anterior</button>
            <span id="info-pagina" style="font-weight: bold; color: #333; font-size: 14px;">Página 1 de 3</span>
            <button id="btn-proxima" class="btn-nav btn-ghost" onclick="mudarPagina(1)" style="cursor: pointer; border: 1px solid #333; border-radius: 20px; padding: 6px 16px; background-color: #ffffff; color: #333;">Próxima &raquo;</button>
        </div>

    </main>

    <script src="/js/web-app.js" defer></script>
</body>
</html>
