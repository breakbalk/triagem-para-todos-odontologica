<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova triagem - COE</title>
    <link rel="stylesheet" href="/css/style.min.css">
</head>
<body class="bg-app" data-page="triagem">

    <header class="app-header">
        <div class="app-header-inner">
            <nav class="app-nav">
                <a href="/pages/home.html" class="btn-nav btn-ghost">← Voltar</a>
                <button type="button" class="btn-nav btn-logout" data-action="logout">Sair</button>
            </nav>
        </div>
    </header>

    <main class="app-main">
        <section class="card-panel">
            <div class="header-card">
                <h2>NOVA TRIAGEM</h2>
                <p class="instrucao">Preencha os dados abaixo para realizar seu pré-agendamento.</p>
            </div>

            <form id="form-triagem" class="form-stack" novalidate>
                <p id="msg" class="form-msg" hidden></p>

                <div class="form-group">
                    <label for="triagem-nome">Nome completo</label>
                    <input type="text" id="triagem-nome" required minlength="3" placeholder="Digite seu nome">
                </div>

                <div class="form-group">
                    <label for="triagem-telefone">Telefone</label>
                    <input type="tel" id="triagem-telefone" required placeholder="(62) 99999-0000">
                </div>

                <div class="form-group grid-full">
                    <label for="triagem-servico">Tipo de serviço</label>
                    <select id="triagem-servico" required>
                        <option value="">Selecione a especialidade...</option>
                        <option value="tratamento_geral">Tratamento geral</option>
                        <option value="protese">Prótese</option>
                        <option value="pediatria">Pediatria (6 a 12 anos)</option>
                        <option value="emergencia">Emergência</option>
                    </select>
                    <small class="helper-text">* Pediatria: Atendimento restrito a crianças de 6 a 12 anos.</small>
                </div>

                <fieldset class="form-group grid-full">
                    <legend>Período de preferência</legend>
                    <div class="radio-group-inline">
                        <label class="radio-line"><input type="radio" name="periodo" value="matutino" required> Matutino</label>
                        <label class="radio-line"><input type="radio" name="periodo" value="vespertino"> Vespertino</label>
                        <label class="radio-line"><input type="radio" name="periodo" value="noturno"> Noturno</label>
                    </div>
                </fieldset>

                <div class="form-group grid-full">
                        <label for="triagem-sintomas">Sintomas / observações (opcional)</label>
                        <textarea id="triagem-sintomas" rows="3" placeholder="Me conte o que você está sentindo?"></textarea>
                </div>

                <button type="submit" class="btn-primary grid-full">ENVIAR TRIAGEM</button>
            </form>

            <aside class="guia-documentos-fixo" aria-labelledby="guia-triagem-titulo">
                <h3 id="guia-triagem-titulo">Antes de ir à clínica</h3>
                <p class="guia-intro">Separe RG/CPF, Cartão SUS e comprovante de residência. A lista completa aparece após o envio da triagem.</p>
            </aside>
        </section>
    </main>

    <script src="/js/web-app.js" defer></script>
</body>
</html>
